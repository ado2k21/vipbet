[build]
  publish = "."
  # Site statique : aucune etape de build, les HTML sont deja prets.
  command = ""

[build.environment]
  # index.html et admin.html contiennent l'URL Supabase et la cle "anon"
  # (publiques par nature, protegees par RLS). Sans cette exclusion, le
  # scanner de secrets de Netlify fait echouer le build en detectant la
  # valeur de SUPABASE_URL dans le HTML publie.
  #
  # SECRETS_SCAN_OMIT_KEYS doit S'INCLURE ELLE-MEME dans sa propre liste.
  # Sinon le scanner cherche aussi la VALEUR de cette variable partout
  # dans le depot -- et comme sa valeur contient le texte "SUPABASE_URL",
  # il retrouve ce texte (un simple nom de variable, jamais une donnee
  # sensible) dans chaque fonction Netlify qui ecrit legitimement
  # process.env.SUPABASE_URL, et fait echouer le build sur un faux
  # positif en cascade. Cette entree ne cache aucun vrai secret : elle ne
  # contient que des NOMS de variables, jamais leur contenu.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SECRETS_SCAN_OMIT_KEYS"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."subscription-reminders"]
  schedule = "0 14 * * *"

[functions."database-backup"]
  schedule = "0 6 * * *"

# ============================================================================
# 27/08/2026 — CAUSE RACINE DU BUG "aucune fiche generee, aucun reglement" :
# ces fonctions exportent bien un config.schedule dans leur propre fichier
# JS, mais Netlify sur ce site ne le prend PAS en compte sans declaration
# explicite ICI (contrairement a database-backup/subscription-reminders,
# qui elles fonctionnent car deja declarees ci-dessus). Sans cette section,
# les bots existent comme fonctions normales mais ne sont JAMAIS
# declenches automatiquement -- confirme par l'absence du badge
# "Scheduled" dans l'onglet Functions de Netlify avant ce correctif.
#
# bot-diagnostics et bot-generate-tickets-manual-background NE SONT VOLONTAIREMENT PAS
# DECLAREES ICI : elles doivent rester des fonctions HTTP normales,
# invocables directement par URL (bot-diagnostics via ?token=..., voir son
# en-tete ; bot-generate-tickets-manual-background depuis le panneau admin) -- toute
# declaration de schedule ici les rendrait injoignables directement.
#
# 28/08 v5 — bot-generate-tickets renommee bot-generate-tickets-background :
# convertie en fonction "Background" Netlify (jusqu'a 15 minutes
# d'execution, au lieu des ~10-26s d'une fonction normale). Necessaire pour
# espacer ses appels /odds (~6.5s entre chaque, voir le fichier) et rester
# sous la limite de 10 requetes/minute d'API-Sports (plan gratuit) sans se
# faire rejeter en HTTP 429 -- cause racine du bug "seulement 9 matchs sur
# 60 candidats produisent une selection" observe le 28/08. Le suffixe
# "-background" dans le nom de fichier ET dans la section ci-dessous est
# ce qui declenche ce comportement special cote Netlify.
#
# Session suivante — fenetre decalee de 20-22 a 21-23 UTC (17h00 -> 18h30
# Haiti, demande explicite de James). dateCible reste toujours "demain" :
# ce decalage n'exclut aucun match, contrairement a un decalage qui aurait
# touche le jour meme.
# ============================================================================
[functions."bot-generate-tickets-background"]
  schedule = "*/15 21-23 * * *"

# bot-settle-results (28/08, demande explicite de James : "le calcul des
# resultats doit se faire a n'importe quelle heure") — passe de
# "0 10-23 * * *" (fenetre 10h-23h UTC, trouee) a toutes les heures, 24h/24.
# Cause du signalement initial : un match ayant debute a 23h10 UTC (apres
# le dernier passage de 23h00, avant celui du lendemain 10h00) restait sans
# resultat pendant plusieurs heures -- aucun lien avec le code du bot
# lui-meme, uniquement une fenetre de planification trop etroite.
[functions."bot-settle-results"]
  schedule = "0 * * * *"

[functions."bot-publish-scheduled"]
  schedule = "*/5 * * * *"
